<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightshade Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="portal">
        <div class="moon">☾</div>

        <h1>Nightshade Portal</h1>
        <p class="subtitle">The crossroads between worlds</p>

        <form id="searchForm">
            <input
                id="searchBox"
                type="text"
                placeholder="Seek what you desire..."
                autocomplete="off"
            >
            <button type="submit">✦ Search</button>
        </form>

        <section class="portals">
            <a href="https://www.google.com" target="_blank">🔍 Search</a>
            <a href="https://www.youtube.com" target="_blank">🎵 YouTube</a>
            <a href="https://github.com" target="_blank">💻 GitHub</a>
            <a href="https://en.wikipedia.org" target="_blank">📖 Archives</a>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
